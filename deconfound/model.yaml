# =============================================================================
# DriveSense-VLM Model Configuration
# =============================================================================
# Base model, LoRA adapter, post-training quantization, and vision settings.
# Phase 2a (SFT Training) and Phase 3b (bitsandbytes) read from this file.
# NEVER hardcode these values in source code — always load via utils/config.py.
# =============================================================================

model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  revision: "main"
  torch_dtype: "bfloat16"
  # sdpa (scaled dot-product attention) works on Colab T4/A100 without flash-attn.
  # Switch to "flash_attention_2" on HPC if flash-attn is installed.
  attn_implementation: "${ATTN_IMPL:sdpa}"

# -----------------------------------------------------------------------------
# LoRA Configuration (applied during Phase 2a SFT)
# -----------------------------------------------------------------------------
lora:
  rank: 32
  alpha: 64           # alpha / rank = 2.0 — standard scaling for rank-32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"
  bias: "none"        # Do not train bias terms — reduces parameter count

# -----------------------------------------------------------------------------
# Quantization (applied post-training in Phase 3b — bitsandbytes NF4)
# -----------------------------------------------------------------------------
quantization:
  method: "bitsandbytes"
  bits: 4
  quant_type: "nf4"          # NormalFloat4 — better accuracy than int4 for LLMs
  double_quant: true         # Quantize the quantization constants (saves ~0.4 bpw)
  compute_dtype: "bfloat16"  # Dequantize to bf16 for matmuls
  target: "llm_only"         # Quantize LLM decoder only; keep ViT in fp16

# -----------------------------------------------------------------------------
# Vision / Image Processing
# -----------------------------------------------------------------------------
vision:
  # Fixed 16:9 dashcam aspect ratio — matches nuScenes cameras.
  # Qwen2.5-VL dynamic resolution uses patch counts, not raw pixel sizes.
  image_resolution: [672, 448]   # [width, height]
  # Patch token counts for Qwen2.5-VL processor (each patch = 28×28 pixels).
  # min_pixels / max_pixels control how many visual tokens the image uses.
  min_pixels: 256
  max_pixels: 768            # ~768 visual tokens/image — preserves small/distant hazard detail
                             # while cutting the visual span vs the old 1280 (throughput lever)
